# Snippet for Home Assistant's configuration.yaml - merge into your
# existing "mqtt:" block, then restart Home Assistant Core. Afterwards
# "Atari XL Button" is available as a binary sensor for automations.
mqtt:
  # ... your existing MQTT entries ...
  binary_sensor:
    - name: "Atari XL Button"
      state_topic: "AtariXL"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: "power"
